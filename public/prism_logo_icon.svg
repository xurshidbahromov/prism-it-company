<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="cut-top">
      <rect width="100" height="100" fill="white" />
      <line x1="-10" y1="110" x2="110" y2="-10" stroke="black" strokeWidth="12" />
      <polygon points="-10,110 110,-10 110,110" fill="black" />
    </mask>
    
    <mask id="cut-bottom">
      <rect width="100" height="100" fill="white" />
      <line x1="-10" y1="110" x2="110" y2="-10" stroke="black" strokeWidth="12" />
      <polygon points="-10,110 110,-10 -10,-10" fill="black" />
    </mask>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Top-Left Glass Block -->
  <rect 
    x="12" 
    y="12" 
    width="76" 
    height="76" 
    rx="22" 
    fill="url(#glass-grad)"
    stroke="currentColor"
    stroke-opacity="0.4"
    stroke-width="4"
    mask="url(#cut-top)" 
  />
  
  <!-- Bottom-Right Glass Block -->
  <rect 
    x="12" 
    y="12" 
    width="76" 
    height="76" 
    rx="22" 
    fill="#3B82F6"
    fill-opacity="0.1"
    stroke="#3B82F6"
    stroke-opacity="0.6"
    stroke-width="4"
    mask="url(#cut-bottom)" 
  />
  
  <!-- Inner Glows -->
  <rect 
    x="14" 
    y="14" 
    width="72" 
    height="72" 
    rx="20" 
    fill="currentColor"
    fill-opacity="0.1"
    mask="url(#cut-top)" 
  />
  <rect 
    x="14" 
    y="14" 
    width="72" 
    height="72" 
    rx="20" 
    fill="#3B82F6"
    fill-opacity="0.2"
    mask="url(#cut-bottom)" 
  />
</svg>
